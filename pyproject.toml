[dependency-groups]
# Host-side test tooling (not deployed to the device). Install with:
#   pip install --group dev      (or: pip install pytest)
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Host-side unit tests for the pure-logic parts of the firmware. Tests sit next to
# the source they cover, named <source>_test.py. src/conftest.py loads
# src/test/test_harness.py, which stubs the MicroPython-only modules (machine,
# utime, esp, ...) so they import on CPython. Run: python -m pytest
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    # MicroPython uses try/except ImportError for optional config — suppress
    # "imported but unused" for that pattern handled per-file below.
]

[tool.ruff.lint.per-file-ignores]
# boot.py imports webrepl at module level but only calls it conditionally
"src/boot.py" = ["F401"]
# Template file is not executable code
"src/configuration/wifi_config_template.py" = ["F401"]
